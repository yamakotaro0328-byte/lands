# LightEco 設定

currency: "円"
start-money: 1000

login-bonus:
  base: 500          # 毎日のログインボーナス
  streak-step: 100   # 連続ログイン1日ごとの追加額
  max-streak-days: 6 # 追加が増える最大日数

land:
  base-price: 1000   # 最初の1チャンクの価格
  step: 500          # 持っている数1つごとに上がる額
  refund-rate: 0.5   # /l unclaim の返金率
  max-per-player: 100

nation:
  create-cost: 50000
  town-max-members: 4     # これを超えると「町」から「国」になる
  member-land-share: true # 同じ町/国のメンバーは互いの土地で建築できる

gamble:
  max-bet: 100000
  cooldown-seconds: 2

jobs:
  max-active: 2
  reward-multiplier: 1.0
